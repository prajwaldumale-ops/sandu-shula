<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Generation Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-btn {
      background-color: #297C82;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      margin: 20px 0;
    }
    .test-btn:hover {
      background-color: #1F6166;
    }
    .info {
      background-color: #f0f8ff;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>PDF Generation Test</h1>
  
  <div class="info">
    <p>This test page simulates the patient data that would be collected during the screening process and tests the PDF generation functionality.</p>
  </div>

  <button class="test-btn" onclick="runPDFTest()">Test PDF Generation</button>

  <div id="test-results"></div>

  <script>
    // Simulate the questions array from screening.html
    const questions = [
      {
        tag: "NO RIGHT OR WRONG ANSWERS",
        title: "Do you often have pain in a knee, hip, hand, or another joint?",
        name: "pain_frequency",
        options: [
          { text: "Never", value: "never", weight: 0 },
          { text: "Sometimes", value: "sometimes", weight: 1 },
          { text: "Often", value: "often", weight: 2 },
          { text: "Almost always", value: "almost_always", weight: 3 },
          { text: "Other", value: "other", weight: 1 }
        ]
      },
      {
        tag: "MORNING COMFORT",
        title: "Does morning joint stiffness usually last longer than 30 minutes after waking up?",
        name: "morning_stiffness",
        options: [
          { text: "No, under 10 minutes", value: "under_10", weight: 0 },
          { text: "10 to 30 minutes", value: "10_30", weight: 1 },
          { text: "30 to 60 minutes", value: "30_60", weight: 2 },
          { text: "More than an hour", value: "over_hour", weight: 3 },
          { text: "I rarely have morning stiffness", value: "rarely", weight: 0 }
        ]
      }
      // Add more questions as needed for testing
    ];

    function runPDFTest() {
      // Simulate patient data
      const onboardingData = {
        fullName: "Test Patient",
        age: 45,
        weight: 70,
        gender: "female",
        email: "test@example.com",
        phone: "+91 98765 43210",
        location: "Bengaluru",
        completedAt: new Date().toISOString()
      };

      const screeningAnswers = {
        pain_frequency: "sometimes",
        morning_stiffness: "10_30"
      };

      const resultsData = {
        score: 2,
        maxScore: 6,
        ratio: 0.33,
        badge: "Moderate Signal",
        completedAt: new Date().toISOString()
      };

      const userData = {
        name: "Test Patient",
        email: "test@example.com",
        phone: "+91 98765 43210"
      };

      // Create formatted date
      const reportDate = new Date().toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      // Determine risk level description
      let riskDescription = '';
      let riskColor = '';
      let riskBackgroundColor = '';
      if (resultsData.badge === 'Elevated Risk Signal') {
        riskDescription = 'Patterns consistent with early osteoarthritis';
        riskColor = '#C62828';
        riskBackgroundColor = '#FFEBEE';
      } else if (resultsData.badge === 'Moderate Signal') {
        riskDescription = 'Notable discomfort patterns detected';
        riskColor = '#E65100';
        riskBackgroundColor = '#FFF3E0';
      } else {
        riskDescription = 'Your joints show healthy or mild signals';
        riskColor = '#2E7D32';
        riskBackgroundColor = '#E8F5E9';
      }

      // Create PDF content HTML with proper print styling
      const pdfContent = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>sandu-sula Joint Health Screening Report</title>
          <style>
            /* Page & Print Setup */
            @page {
              size: A4;
              margin: 20mm 15mm 20mm 15mm;
              @top-center {
                content: "sandu-sula · Joint Health Screening Report";
                font-family: system-ui, sans-serif;
                font-size: 8pt;
                color: #6b7280;
                border-bottom: 1px solid #e5e7eb;
                width: 100%;
                padding-bottom: 5px;
              }
              @bottom-center {
                content: "Page " counter(page) " of " counter(pages) " — Digitally generated report. Not a formal medical diagnosis.";
                font-family: system-ui, sans-serif;
                font-size: 8pt;
                color: #9ca3af;
                border-top: 1px solid #e5e7eb;
                width: 100%;
                padding-top: 5px;
              }
            }

            * {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              color: #1f2937;
            }

            body {
              background-color: #ffffff;
              font-size: 10pt;
              line-height: 1.4;
            }

            /* Prevent awkward element splitting */
            .section-card, .patient-info-box, .qa-item, .results-banner, .recommendations-box {
              break-inside: avoid;
              page-break-inside: avoid;
            }

            /* Layout Containers */
            .report-container {
              max-width: 100%;
              margin: 0 auto;
            }

            /* Header Section */
            .brand-header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              border-bottom: 2px solid #0d5c56;
              padding-bottom: 12px;
              margin-bottom: 20px;
              break-inside: avoid;
              page-break-inside: avoid;
            }

            .brand-logo {
              display: flex;
              align-items: center;
              gap: 8px;
              font-weight: 700;
              font-size: 14pt;
              color: #0d5c56;
            }

            .brand-logo img {
              width: 40px;
              height: 40px;
              object-fit: contain;
            }

            .report-meta {
              text-align: right;
              font-size: 8.5pt;
              color: #4b5563;
            }

            /* Grid layout for patient details */
            .patient-info-box {
              background-color: #fcfbf9;
              border: 1px solid #f0eee6;
              border-radius: 8px;
              padding: 16px;
              margin-bottom: 20px;
            }

            .section-title {
              font-size: 10pt;
              color: #0d5c56;
              margin-bottom: 10px;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              font-weight: 600;
            }

            .info-grid {
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 12px;
            }

            .info-item label {
              font-size: 8pt;
              color: #6b7280;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              display: block;
            }

            .info-item span {
              font-size: 10pt;
              font-weight: 600;
              color: #111827;
            }

            /* Results Box */
            .results-banner {
              background-color: ${riskBackgroundColor};
              border-left: 4px solid ${riskColor};
              padding: 16px;
              border-radius: 0 8px 8px 0;
              margin-bottom: 20px;
            }

            .results-banner h2 {
              font-size: 12pt;
              color: ${riskColor};
              margin-bottom: 4px;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            }

            .score-grid {
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 12px;
              margin-bottom: 20px;
            }

            .score-box {
              background-color: #f9fafb;
              border: 1px solid #e5e7eb;
              border-radius: 6px;
              padding: 12px;
              text-align: center;
            }

            .score-box .label {
              font-size: 8pt;
              color: #6b7280;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            }

            .score-box .value {
              font-size: 18pt;
              font-weight: 700;
              color: #0d5c56;
            }

            .assessment-type {
              background-color: #f9fafb;
              border: 1px solid #e5e7eb;
              border-radius: 6px;
              padding: 12px;
              margin-bottom: 20px;
            }

            /* Questions List Styling */
            .qa-section {
              margin-top: 20px;
            }

            .qa-section h3 {
              font-size: 11pt;
              margin-bottom: 12px;
              color: #111827;
              border-bottom: 1px solid #e5e7eb;
              padding-bottom: 4px;
            }

            .qa-item {
              margin-bottom: 10px;
              padding: 8px 10px;
              background: #f9fafb;
              border-radius: 6px;
              border: 1px solid #f3f4f6;
            }

            .question {
              font-weight: 600;
              font-size: 9pt;
              color: #374151;
            }

            .answer {
              font-size: 9pt;
              color: #0d5c56;
              margin-top: 2px;
            }

            /* Recommendations Section */
            .recommendations-box {
              background-color: #f0fdf4;
              border-left: 4px solid #16a34a;
              padding: 16px;
              border-radius: 0 8px 8px 0;
              margin-bottom: 20px;
            }

            .recommendations-box h3 {
              font-size: 11pt;
              color: #16a34a;
              margin-bottom: 8px;
            }

            .next-steps {
              background-color: #f9fafb;
              border: 1px solid #e5e7eb;
              border-radius: 6px;
              padding: 12px;
              margin-top: 12px;
            }

            .next-steps h4 {
              font-size: 9pt;
              color: #6b7280;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              margin-bottom: 8px;
            }

            .next-steps ul {
              margin-left: 20px;
              font-size: 9pt;
              color: #374151;
            }

            /* Disclaimer Footer block inside document flow */
            .document-disclaimer {
              margin-top: 30px;
              padding: 12px;
              background-color: #fef3c7;
              border: 1px dashed #f59e0b;
              border-radius: 6px;
              font-size: 8pt;
              color: #92400e;
              text-align: center;
              break-inside: avoid;
              page-break-inside: avoid;
            }

            .document-disclaimer strong {
              color: #92400e;
            }

            .footer-branding {
              margin-top: 20px;
              padding-top: 15px;
              border-top: 2px solid #0d5c56;
              text-align: center;
              break-inside: avoid;
              page-break-inside: avoid;
            }

            .footer-branding .logo-text {
              font-weight: 600;
              font-size: 12pt;
              color: #0d5c56;
              margin-bottom: 4px;
            }

            .footer-branding .tagline {
              font-size: 8pt;
              color: #6b7280;
              margin-bottom: 4px;
            }

            .footer-branding .website {
              font-size: 8pt;
              color: #0d5c56;
              font-weight: 500;
            }

            .footer-branding .copyright {
              font-size: 7pt;
              color: #9ca3af;
              margin-top: 8px;
            }
          </style>
        </head>
        <body>

          <div class="report-container">
            
            <!-- Brand Header -->
            <div class="brand-header">
              <div class="brand-logo">
                <img src="images/logo.jpeg" alt="sandu-sula logo" onerror="this.style.display='none'; this.parentNode.innerHTML='🌿';" />
                <span>sandu-sula</span>
              </div>
              <div class="report-meta">
                <strong>Report Date:</strong> ${reportDate}<br>
                <strong>Report ID:</strong> SS-${Date.now().toString().slice(-8)}
              </div>
            </div>

            <!-- Patient Information Section -->
            <div class="patient-info-box">
              <h3 class="section-title">Patient Information</h3>
              <div class="info-grid">
                <div class="info-item"><label>Full Name</label><span>${onboardingData.fullName || userData.name || 'N/A'}</span></div>
                <div class="info-item"><label>Email</label><span>${onboardingData.email || userData.email || 'N/A'}</span></div>
                <div class="info-item"><label>Phone Number</label><span>${onboardingData.phone || userData.phone || 'N/A'}</span></div>
                <div class="info-item"><label>Location</label><span>${onboardingData.location || 'N/A'}</span></div>
                <div class="info-item"><label>Age</label><span>${onboardingData.age || 'N/A'} years</span></div>
                <div class="info-item"><label>Weight</label><span>${onboardingData.weight || 'N/A'} kg</span></div>
                <div class="info-item"><label>Gender</label><span>${onboardingData.gender || 'N/A'}</span></div>
                <div class="info-item"><label>Assessment Date</label><span>${new Date(onboardingData.completedAt || resultsData.completedAt).toLocaleDateString()}</span></div>
              </div>
            </div>

            <!-- Screening Results -->
            <div class="results-banner">
              <h2>${(resultsData.badge || 'Risk Assessment').toUpperCase()} (${((resultsData.ratio || 0) * 100).toFixed(1)}%)</h2>
              <p style="font-size: 9.5pt; color: #374151;">${riskDescription}. Joint Check-in Score: <strong>${resultsData.score || 0}/${resultsData.maxScore || 0}</strong></p>
            </div>

            <div class="score-grid">
              <div class="score-box">
                <div class="label">Joint Check-in Score</div>
                <div class="value">${resultsData.score || 0} / ${resultsData.maxScore || 0}</div>
              </div>
              <div class="score-box">
                <div class="label">Risk Ratio</div>
                <div class="value">${((resultsData.ratio || 0) * 100).toFixed(1)}%</div>
              </div>
            </div>

            <div class="assessment-type">
              <p style="margin: 0; font-size: 9pt; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em;">Assessment Type</p>
              <p style="margin: 4px 0 0 0; font-size: 10pt; font-weight: 600; color: #111827;">14-Point Clinical Osteoarthritis Check</p>
            </div>

            <!-- Detailed Assessment Responses -->
            <div class="qa-section">
              <h3>Detailed Assessment Responses</h3>
              
              ${questions.map((q, index) => {
                const answerValue = screeningAnswers[q.name];
                const answerText = q.options.find(o => o.value === answerValue)?.text || 'Not answered';
                return `
                  <div class="qa-item">
                    <div class="question">Q${index + 1}: ${q.title}</div>
                    <div class="answer">A: ${answerText}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Recommendations Section -->
            <div class="recommendations-box">
              <h3>Recommendations</h3>
              <p style="font-size: 9pt; color: #374151; line-height: 1.5;">
                ${resultsData.badge === 'Elevated Risk Signal' 
                  ? 'Your answers reflect recurrent joint pain, morning stiffness, and mobility changes. We strongly recommend discussing these signals with a physician or joint specialist to help slow progression and safeguard your daily comfort.' 
                  : resultsData.badge === 'Moderate Signal'
                  ? 'Several of your answers suggest early joint tissue changes or load sensitivity. Targeted physical therapy, joint mobility routines, and ergonomic adjustments are often very effective at this stage.'
                  : 'Your answers indicate predominantly occasional or mild joint discomfort. Maintaining low-impact movement, proper footwear, and joint-friendly nutrition can keep your mobility resilient.'}
              </p>
              
              <div class="next-steps">
                <h4>Recommended Next Steps:</h4>
                <ul>
                  <li>Consult with a healthcare professional for proper evaluation</li>
                  <li>Explore joint care options near ${onboardingData.location || 'your area'}</li>
                  <li>Maintain regular low-impact physical activity</li>
                  <li>Monitor joint comfort patterns over time</li>
                </ul>
              </div>
            </div>

            <!-- Digital Generation Disclaimer -->
            <div class="document-disclaimer">
              <strong>Digital Generation Notice:</strong> This is a digitally generated document produced by sandu-sula. It serves as an educational risk-screening tool and does not substitute for professional medical diagnosis, advice, or treatment.
            </div>

            <!-- Footer Branding -->
            <div class="footer-branding">
              <div class="logo-text">sandu-sula</div>
              <div class="tagline">A kinder way to begin understanding joint health</div>
              <div class="website">www.sandusula.com</div>
              <div class="copyright">© ${new Date().getFullYear()} sandu-sula. All rights reserved.</div>
            </div>

          </div>

        </body>
        </html>
      `;

      // PDF generation options with proper page handling
      const opt = {
        margin: [20, 15, 20, 15], // Top, Right, Bottom, Left in mm
        filename: `sandusula-report-${onboardingData.fullName || 'patient'}-${Date.now()}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2, 
          useCORS: true,
          letterRendering: true
        },
        jsPDF: { 
          unit: 'mm', 
          format: 'a4', 
          orientation: 'portrait' 
        },
        pagebreak: { 
          mode: ['avoid-all', 'css', 'legacy'], 
          before: '.section-card', 
          after: '.section-card', 
          avoid: ['.patient-info-box', '.qa-item', '.results-banner', '.recommendations-box'] 
        }
      };

      // Generate and download PDF
      try {
        html2pdf().set(opt).from(pdfContent).save().then(() => {
          document.getElementById('test-results').innerHTML = `
            <div style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 20px;">
              <strong>✓ Success!</strong> PDF has been generated and downloaded successfully.
              <br><br>
              <small>Filename: ${opt.filename}</small>
            </div>
          `;
        }).catch(err => {
          document.getElementById('test-results').innerHTML = `
            <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px;">
              <strong>✗ Error:</strong> ${err.message}
            </div>
          `;
        });
      } catch (error) {
        document.getElementById('test-results').innerHTML = `
          <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px;">
            <strong>✗ Error:</strong> ${error.message}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
