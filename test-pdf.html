<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Generation Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-btn {
      background-color: #297C82;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      margin: 20px 0;
    }
    .test-btn:hover {
      background-color: #1F6166;
    }
    .info {
      background-color: #f0f8ff;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>PDF Generation Test</h1>
  
  <div class="info">
    <p>This test page simulates the patient data that would be collected during the screening process and tests the PDF generation functionality.</p>
  </div>

  <button class="test-btn" onclick="runPDFTest()">Test PDF Generation</button>

  <div id="test-results"></div>

  <script>
    // Simulate the questions array from screening.html with all 14 questions
    const questions = [
      {
        tag: "NO RIGHT OR WRONG ANSWERS",
        title: "Do you often have pain in a knee, hip, hand, or another joint?",
        name: "pain_frequency",
        options: [
          { text: "Never", value: "never", weight: 0 },
          { text: "Sometimes", value: "sometimes", weight: 1 },
          { text: "Often", value: "often", weight: 2 },
          { text: "Almost always", value: "almost_always", weight: 3 },
          { text: "Other", value: "other", weight: 1 }
        ]
      },
      {
        tag: "MORNING COMFORT",
        title: "Does morning joint stiffness usually last longer than 30 minutes after waking up?",
        name: "morning_stiffness",
        options: [
          { text: "No, under 10 minutes", value: "under_10", weight: 0 },
          { text: "10 to 30 minutes", value: "10_30", weight: 1 },
          { text: "30 to 60 minutes", value: "30_60", weight: 2 },
          { text: "More than an hour", value: "over_hour", weight: 3 },
          { text: "I rarely have morning stiffness", value: "rarely", weight: 0 }
        ]
      },
      {
        tag: "JOINT SENSATIONS",
        title: "Do you hear or feel a cracking, grating, or clicking sound when you bend the joint?",
        name: "crepitus",
        options: [
          { text: "Never", value: "never", weight: 0 },
          { text: "Occasionally, without discomfort", value: "occasional_no_pain", weight: 1 },
          { text: "Frequently, with mild aching", value: "frequent_mild", weight: 2 },
          { text: "Almost every time I move", value: "constant", weight: 3 }
        ]
      },
      {
        tag: "DAILY MOVEMENT",
        title: "Does joint discomfort increase after climbing stairs, walking, or standing for a while?",
        name: "activity_pain",
        options: [
          { text: "Not at all", value: "none", weight: 0 },
          { text: "Only after intense exercise", value: "intense_only", weight: 1 },
          { text: "After moderate walking (15–20 mins)", value: "moderate", weight: 2 },
          { text: "Even after a few steps or brief standing", value: "severe", weight: 3 }
        ]
      },
      {
        tag: "SWELLING & SENSITIVITY",
        title: "Have you noticed visible swelling, puffiness, or warmth around any affected joint?",
        name: "swelling",
        options: [
          { text: "Never noticed swelling", value: "never", weight: 0 },
          { text: "Only after long, busy days", value: "rarely", weight: 1 },
          { text: "Yes, periodically several times a month", value: "sometimes", weight: 2 },
          { text: "Yes, persistent or frequent swelling", value: "frequent", weight: 3 }
        ]
      },
      {
        tag: "WARMTH & RELIEF",
        title: "Does light walking or a warm shower tend to ease your joint stiffness?",
        name: "movement_relief",
        options: [
          { text: "Yes, noticeably eases up", value: "yes_eases", weight: 2 },
          { text: "A little bit", value: "a_little", weight: 1 },
          { text: "No, movement often makes it hurt more", value: "makes_worse", weight: 3 },
          { text: "Not sure", value: "unsure", weight: 1 }
        ]
      },
      {
        tag: "RANGE OF MOTION",
        title: "Have you experienced reduced flexibility, like difficulty fully bending or straightening the joint?",
        name: "flexibility",
        options: [
          { text: "Full flexibility, no restriction", value: "full", weight: 0 },
          { text: "Slight tightness at the extremes", value: "slight", weight: 1 },
          { text: "Noticeably limited movement", value: "moderate", weight: 2 },
          { text: "Significantly locked or stiff", value: "severe", weight: 3 }
        ]
      },
      {
        tag: "WEATHER PATTERNS",
        title: "Does cold, rainy, or humid weather make your joint aching feel more prominent?",
        name: "weather_sensitivity",
        options: [
          { text: "No difference", value: "no", weight: 0 },
          { text: "Mildly noticeable during seasonal shifts", value: "mild", weight: 1 },
          { text: "Yes, weather changes definitely trigger ache", value: "yes", weight: 2 },
          { text: "Unsure", value: "unsure", weight: 0 }
        ]
      },
      {
        tag: "JOINT HISTORY",
        title: "Have you had a past injury, ligament sprain, or surgery on this joint?",
        name: "past_injury",
        options: [
          { text: "No previous injuries", value: "no", weight: 0 },
          { text: "Yes, minor sports sprain in the past", value: "minor", weight: 1 },
          { text: "Yes, major injury or fracture years ago", value: "major", weight: 3 },
          { text: "Yes, previous joint surgery", value: "surgery", weight: 3 }
        ]
      },
      {
        tag: "EVERYDAY MOBILITY",
        title: "Do you have difficulty getting up from a low chair, deep sofa, or car seat?",
        name: "chair_stand",
        options: [
          { text: "Easy without using arms", value: "easy", weight: 0 },
          { text: "A little stiff, but manage fine", value: "mild", weight: 1 },
          { text: "Need to push up firmly with both arms", value: "moderate", weight: 2 },
          { text: "Very challenging or painful", value: "difficult", weight: 3 }
        ]
      },
      {
        tag: "REST & SLEEP",
        title: "Does joint ache or discomfort disturb your sleep or wake you at night?",
        name: "sleep_disturbance",
        options: [
          { text: "Never wakes me", value: "never", weight: 0 },
          { text: "Occasionally if I sleep in an awkward position", value: "occasional", weight: 1 },
          { text: "Yes, 1 to 2 nights a week", value: "weekly", weight: 2 },
          { text: "Frequent sleep disruption most nights", value: "frequent", weight: 3 }
        ]
      },
      {
        tag: "ACTIVITY HESITATION",
        title: "Do you find yourself avoiding hobbies, walking, or stairs due to joint concern?",
        name: "activity_avoidance",
        options: [
          { text: "No, doing all regular activities", value: "no", weight: 0 },
          { text: "A little more cautious than before", value: "cautious", weight: 1 },
          { text: "Yes, cut back on walking and stairs", value: "moderate", weight: 2 },
          { text: "Significantly limited daily life", value: "severe", weight: 3 }
        ]
      },
      {
        tag: "FAMILY BACKGROUND",
        title: "Have any close family members (parents, siblings) been diagnosed with joint wear or OA?",
        name: "family_history",
        options: [
          { text: "No known history", value: "no", weight: 0 },
          { text: "One immediate family member", value: "one", weight: 2 },
          { text: "Multiple family members", value: "multiple", weight: 3 },
          { text: "Unsure / Adopted", value: "unsure", weight: 1 }
        ]
      },
      {
        tag: "JOINT CONTOUR",
        title: "Have you noticed any visible enlargement, knobby nodes, or changes in joint shape?",
        name: "joint_shape",
        options: [
          { text: "No visible changes", value: "no", weight: 0 },
          { text: "Slight bony fullness", value: "slight", weight: 1 },
          { text: "Clear knobby changes (e.g. Heberden nodes or knee curvature)", value: "yes", weight: 3 },
          { text: "Unsure", value: "unsure", weight: 0 }
        ]
      }
    ];

    async function runPDFTest() {
      // Simulate patient data
      const onboardingData = {
        fullName: "Test Patient",
        age: 45,
        weight: 70,
        gender: "female",
        email: "test@example.com",
        phone: "+91 98765 43210",
        location: "Bengaluru",
        completedAt: new Date().toISOString()
      };

      // Generate random answers for all 14 questions
      const screeningAnswers = {};
      let totalWeight = 0;
      let maxPossible = 0;

      questions.forEach(q => {
        const randomOption = q.options[Math.floor(Math.random() * q.options.length)];
        screeningAnswers[q.name] = randomOption.value;
        totalWeight += randomOption.weight;
        maxPossible += Math.max(...q.options.map(o => o.weight));
      });

      // Calculate results based on random answers
      const ratio = totalWeight / maxPossible;
      let badge = 'Mild / Low Risk Signal';
      if (ratio >= 0.55) {
        badge = 'Elevated Risk Signal';
      } else if (ratio >= 0.3) {
        badge = 'Moderate Signal';
      }

      const resultsData = {
        score: totalWeight,
        maxScore: maxPossible,
        ratio: ratio.toFixed(2),
        badge: badge,
        completedAt: new Date().toISOString()
      };

      const userData = {
        name: "Test Patient",
        email: "test@example.com",
        phone: "+91 98765 43210"
      };

      // Create formatted date
      const reportDate = new Date().toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      // Generate unique report ID
      const reportId = 'SS-' + Date.now().toString().slice(-8) + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();

      // Determine risk level description
      let riskDescription = '';
      let riskColor = '';
      let riskBackgroundColor = '';
      if (resultsData.badge === 'Elevated Risk Signal') {
        riskDescription = 'Patterns consistent with early osteoarthritis';
        riskColor = '#C62828';
        riskBackgroundColor = '#FFEBEE';
      } else if (resultsData.badge === 'Moderate Signal') {
        riskDescription = 'Notable discomfort patterns detected';
        riskColor = '#E65100';
        riskBackgroundColor = '#FFF3E0';
      } else {
        riskDescription = 'Your joints show healthy or mild signals';
        riskColor = '#2E7D32';
        riskBackgroundColor = '#E8F5E9';
      }

      // Create PDF content HTML with proper print styling
      const pdfContent = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>sandu-sula Joint Health Screening Report - ${reportId}</title>
          <style>
            /* Page & Print Setup */
            @page {
              size: A4;
              margin: 20mm 15mm 20mm 15mm;
              @top-left {
                content: "sandu-sula";
                font-family: system-ui, sans-serif;
                font-size: 10pt;
                color: #0d5c56;
                font-weight: 700;
              }
              @top-right {
                content: "Report ID: " attr(data-report-id) " | " attr(data-report-date);
                font-family: system-ui, sans-serif;
                font-size: 8pt;
                color: #4b5563;
                text-align: right;
              }
              @bottom-center {
                content: "www.sandusula.com | Page " counter(page) " of " counter(pages);
                font-family: system-ui, sans-serif;
                font-size: 8pt;
                color: #6b7280;
                border-top: 1px solid #e5e7eb;
                width: 100%;
                padding-top: 8px;
              }
            }

            * {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              color: #1f2937;
            }

            body {
              background-color: #ffffff;
              font-size: 10pt;
              line-height: 1.4;
            }

            /* Prevent awkward element splitting */
            .section-card, .patient-info-box, .qa-item, .results-banner, .recommendations-box {
              break-inside: avoid;
              page-break-inside: avoid;
            }

            /* Layout Containers */
            .report-container {
              max-width: 100%;
              margin: 0 auto;
            }

            /* Grid layout for patient details */
            .patient-info-box {
              background-color: #fcfbf9;
              border: 1px solid #f0eee6;
              border-radius: 8px;
              padding: 16px;
              margin-bottom: 20px;
            }

            .section-title {
              font-size: 10pt;
              color: #0d5c56;
              margin-bottom: 10px;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              font-weight: 600;
            }

            .info-grid {
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 12px;
            }

            .info-item label {
              font-size: 8pt;
              color: #6b7280;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              display: block;
            }

            .info-item span {
              font-size: 10pt;
              font-weight: 600;
              color: #111827;
            }

            /* Results Box */
            .results-banner {
              background-color: ${riskBackgroundColor};
              border-left: 4px solid ${riskColor};
              padding: 16px;
              border-radius: 0 8px 8px 0;
              margin-bottom: 20px;
            }

            .results-banner h2 {
              font-size: 12pt;
              color: ${riskColor};
              margin-bottom: 4px;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            }

            .score-grid {
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 12px;
              margin-bottom: 20px;
            }

            .score-box {
              background-color: #f9fafb;
              border: 1px solid #e5e7eb;
              border-radius: 6px;
              padding: 12px;
              text-align: center;
            }

            .score-box .label {
              font-size: 8pt;
              color: #6b7280;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            }

            .score-box .value {
              font-size: 18pt;
              font-weight: 700;
              color: #0d5c56;
            }

            .assessment-type {
              background-color: #f9fafb;
              border: 1px solid #e5e7eb;
              border-radius: 6px;
              padding: 12px;
              margin-bottom: 20px;
            }

            /* Questions List Styling */
            .qa-section {
              margin-top: 20px;
            }

            .qa-section h3 {
              font-size: 11pt;
              margin-bottom: 12px;
              color: #111827;
              border-bottom: 1px solid #e5e7eb;
              padding-bottom: 4px;
            }

            .qa-item {
              margin-bottom: 10px;
              padding: 8px 10px;
              background: #f9fafb;
              border-radius: 6px;
              border: 1px solid #f3f4f6;
            }

            .question {
              font-weight: 600;
              font-size: 9pt;
              color: #374151;
            }

            .answer {
              font-size: 9pt;
              color: #0d5c56;
              margin-top: 2px;
            }

            /* Recommendations Section */
            .recommendations-box {
              background-color: #f0fdf4;
              border-left: 4px solid #16a34a;
              padding: 16px;
              border-radius: 0 8px 8px 0;
              margin-bottom: 20px;
            }

            .recommendations-box h3 {
              font-size: 11pt;
              color: #16a34a;
              margin-bottom: 8px;
            }

            .next-steps {
              background-color: #f9fafb;
              border: 1px solid #e5e7eb;
              border-radius: 6px;
              padding: 12px;
              margin-top: 12px;
            }

            .next-steps h4 {
              font-size: 9pt;
              color: #6b7280;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              margin-bottom: 8px;
            }

            .next-steps ul {
              margin-left: 20px;
              font-size: 9pt;
              color: #374151;
            }

            /* Disclaimer Footer block inside document flow */
            .document-disclaimer {
              margin-top: 30px;
              padding: 12px;
              background-color: #fef3c7;
              border: 1px dashed #f59e0b;
              border-radius: 6px;
              font-size: 8pt;
              color: #92400e;
              text-align: center;
              break-inside: avoid;
              page-break-inside: avoid;
            }

            .document-disclaimer strong {
              color: #92400e;
            }
          </style>
        </head>
        <body data-report-id="${reportId}" data-report-date="${reportDate} ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}">

          <div class="report-container">
            
            <!-- Patient Information Section -->
            <div class="patient-info-box">
              <h3 class="section-title">Patient Information</h3>
              <div class="info-grid">
                <div class="info-item"><label>Full Name</label><span>${onboardingData.fullName || userData.name || 'N/A'}</span></div>
                <div class="info-item"><label>Email</label><span>${onboardingData.email || userData.email || 'N/A'}</span></div>
                <div class="info-item"><label>Phone Number</label><span>${onboardingData.phone || userData.phone || 'N/A'}</span></div>
                <div class="info-item"><label>Location</label><span>${onboardingData.location || 'N/A'}</span></div>
                <div class="info-item"><label>Age</label><span>${onboardingData.age || 'N/A'} years</span></div>
                <div class="info-item"><label>Weight</label><span>${onboardingData.weight || 'N/A'} kg</span></div>
                <div class="info-item"><label>Gender</label><span>${onboardingData.gender || 'N/A'}</span></div>
                <div class="info-item"><label>Assessment Date</label><span>${new Date(onboardingData.completedAt || resultsData.completedAt).toLocaleDateString()}</span></div>
              </div>
            </div>

            <!-- Screening Results -->
            <div class="results-banner">
              <h2>${(resultsData.badge || 'Risk Assessment').toUpperCase()} (${((resultsData.ratio || 0) * 100).toFixed(1)}%)</h2>
              <p style="font-size: 9.5pt; color: #374151;">${riskDescription}. Joint Check-in Score: <strong>${resultsData.score || 0}/${resultsData.maxScore || 0}</strong></p>
            </div>

            <div class="score-grid">
              <div class="score-box">
                <div class="label">Joint Check-in Score</div>
                <div class="value">${resultsData.score || 0} / ${resultsData.maxScore || 0}</div>
              </div>
              <div class="score-box">
                <div class="label">Risk Ratio</div>
                <div class="value">${((resultsData.ratio || 0) * 100).toFixed(1)}%</div>
              </div>
            </div>

            <div class="assessment-type">
              <p style="margin: 0; font-size: 9pt; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em;">Assessment Type</p>
              <p style="margin: 4px 0 0 0; font-size: 10pt; font-weight: 600; color: #111827;">14-Point Clinical Osteoarthritis Check</p>
            </div>

            <!-- Detailed Assessment Responses -->
            <div class="qa-section">
              <h3>Detailed Assessment Responses</h3>
              
              ${questions.map((q, index) => {
                const answerValue = screeningAnswers[q.name];
                const answerText = q.options.find(o => o.value === answerValue)?.text || 'Not answered';
                return `
                  <div class="qa-item">
                    <div class="question">Q${index + 1}: ${q.title}</div>
                    <div class="answer">A: ${answerText}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Recommendations Section -->
            <div class="recommendations-box">
              <h3>Recommendations</h3>
              <p style="font-size: 9pt; color: #374151; line-height: 1.5;">
                ${resultsData.badge === 'Elevated Risk Signal' 
                  ? 'Your answers reflect recurrent joint pain, morning stiffness, and mobility changes. We strongly recommend discussing these signals with a physician or joint specialist to help slow progression and safeguard your daily comfort.' 
                  : resultsData.badge === 'Moderate Signal'
                  ? 'Several of your answers suggest early joint tissue changes or load sensitivity. Targeted physical therapy, joint mobility routines, and ergonomic adjustments are often very effective at this stage.'
                  : 'Your answers indicate predominantly occasional or mild joint discomfort. Maintaining low-impact movement, proper footwear, and joint-friendly nutrition can keep your mobility resilient.'}
              </p>
              
              <div class="next-steps">
                <h4>Recommended Next Steps:</h4>
                <ul>
                  <li>Consult with a healthcare professional for proper evaluation</li>
                  <li>Explore joint care options near ${onboardingData.location || 'your area'}</li>
                  <li>Maintain regular low-impact physical activity</li>
                  <li>Monitor joint comfort patterns over time</li>
                </ul>
              </div>
            </div>

            <!-- Digital Generation Disclaimer -->
            <div class="document-disclaimer">
              <strong>Digital Generation Notice:</strong> This is a digitally generated document produced by sandu-sula. It serves as an educational risk-screening tool and does not substitute for professional medical diagnosis, advice, or treatment.
            </div>

          </div>

        </body>
        </html>
      `;

      // PDF generation options with proper page handling
      const opt = {
        margin: [25, 15, 25, 15], // Top, Right, Bottom, Left in mm (increased for header/footer)
        filename: `sandusula-report-${reportId}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2, 
          useCORS: true,
          letterRendering: true
        },
        jsPDF: { 
          unit: 'mm', 
          format: 'a4', 
          orientation: 'portrait' 
        },
        pagebreak: { 
          mode: ['avoid-all', 'css', 'legacy'], 
          before: '.section-card', 
          after: '.section-card', 
          avoid: ['.patient-info-box', '.qa-item', '.results-banner', '.recommendations-box'] 
        }
      };

      // Generate and download PDF
      try {
        // Load logo image first
        const logoImg = new Image();
        logoImg.crossOrigin = 'anonymous';
        logoImg.src = 'images/logo.jpeg';
        
        await new Promise((resolve, reject) => {
          logoImg.onload = resolve;
          logoImg.onerror = () => resolve(); // Continue even if image fails to load
          // Set a timeout in case image loading hangs
          setTimeout(resolve, 2000);
        });

        html2pdf()
          .set(opt)
          .from(pdfContent)
          .toPdf()
          .get('pdf').then(function(pdf) {
            // Add headers and footers to all pages
            const totalPages = pdf.internal.getNumberOfPages();
            
            for (let i = 1; i <= totalPages; i++) {
              pdf.setPage(i);
              
              // Add header with logo
              try {
                if (logoImg.complete && logoImg.naturalWidth > 0) {
                  pdf.addImage(logoImg, 'JPEG', 15, 6, 8, 8);
                  pdf.setFontSize(10);
                  pdf.setTextColor(13, 92, 86); // #0d5c56
                  pdf.setFont('helvetica', 'bold');
                  pdf.text('sandu-sula', 26, 12);
                } else {
                  // Fallback to emoji if image doesn't load
                  pdf.setFontSize(10);
                  pdf.setTextColor(13, 92, 86); // #0d5c56
                  pdf.setFont('helvetica', 'bold');
                  pdf.text('🌿 sandu-sula', 15, 12);
                }
              } catch (e) {
                // Fallback to emoji if there's an error
                pdf.setFontSize(10);
                pdf.setTextColor(13, 92, 86); // #0d5c56
                pdf.setFont('helvetica', 'bold');
                pdf.text('🌿 sandu-sula', 15, 12);
              }
              
              pdf.setFontSize(8);
              pdf.setTextColor(75, 85, 99); // #4b5563
              pdf.setFont('helvetica', 'normal');
              pdf.text(`Report ID: ${reportId}`, 140, 12);
              pdf.text(`${reportDate} ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`, 140, 17);
              
              // Header line
              pdf.setDrawColor(13, 92, 86);
              pdf.setLineWidth(0.3);
              pdf.line(15, 20, 195, 20);
              
              // Add footer
              pdf.setDrawColor(229, 231, 235); // #e5e7eb
              pdf.setLineWidth(0.2);
              pdf.line(15, 280, 195, 280);
              
              pdf.setFontSize(8);
              pdf.setTextColor(107, 114, 128); // #6b7280
              pdf.setFont('helvetica', 'normal');
              
              // Right side - Page number and website
              const footerText = `www.sandusula.com | Page ${i} of ${totalPages}`;
              const textWidth = pdf.getTextWidth(footerText);
              pdf.text(footerText, 195 - textWidth, 285);
              
              // Left - Copyright
              pdf.setFontSize(7);
              pdf.setTextColor(156, 163, 175); // #9ca3af
              pdf.text(`© ${new Date().getFullYear()} sandu-sula. All rights reserved.`, 15, 285);
            }
          })
          .save()
          .then(() => {
            document.getElementById('test-results').innerHTML = `
              <div style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 20px;">
                <strong>✓ Success!</strong> PDF has been generated and downloaded successfully with headers and footers.
                <br><br>
                <div style="font-size: 13px; margin-top: 10px;">
                  <strong>Report Details:</strong><br>
                  • Report ID: ${reportId}<br>
                  • Report Date: ${reportDate}<br>
                  • Patient: ${onboardingData.fullName}<br>
                  • Risk Level: ${resultsData.badge} (${(resultsData.ratio * 100).toFixed(1)}%)<br>
                  • Score: ${resultsData.score}/${resultsData.maxScore}<br>
                  • Filename: ${opt.filename}
                </div>
              </div>
            `;
          })
          .catch(err => {
            document.getElementById('test-results').innerHTML = `
              <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px;">
                <strong>✗ Error:</strong> ${err.message}
              </div>
            `;
          });
      } catch (error) {
        document.getElementById('test-results').innerHTML = `
          <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px;">
            <strong>✗ Error:</strong> ${error.message}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
